name: Build and publish mobile apps

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: focusar-release
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: chmod +x tool/prepare_android.sh && tool/prepare_android.sh
      - run: flutter pub get
      - name: Build universal Android APK
        run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk FocusAR-Android.apk
      - name: Build architecture-specific Android APKs
        run: flutter build apk --release --split-per-abi
      - run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk FocusAR-Android-arm64-v8a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            FocusAR-Android.apk
            FocusAR-Android-arm64-v8a.apk

  ios:
    needs: quality
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: chmod +x tool/prepare_ios.sh && tool/prepare_ios.sh
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: mkdir Payload && cp -R build/ios/iphoneos/Runner.app Payload/ && zip -qry FocusAR-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: FocusAR-iOS-unsigned.ipa

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Pick the tag for this build
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # The tag comes from pubspec.yaml: 0.2.0+3 becomes v0.2, while a
          # non-zero patch is kept, so 0.2.1+5 becomes v0.2.1. A push that
          # does not bump the version falls back to the build number, then to
          # the run number, so every push gets its own release and no two tags
          # ever collide.
          version="$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//')"
          semver="${version%%+*}"
          build="${version##*+}"
          [ "$build" = "$version" ] && build="0"
          base="v${semver%.0}"

          tag="$base"
          if gh release view "$tag" >/dev/null 2>&1; then
            tag="$base-build.$build"
            if gh release view "$tag" >/dev/null 2>&1; then
              tag="$base-build.$build.$RUN_NUMBER"
            fi
          fi

          echo "Publishing pubspec version $version as $tag"
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "FocusAR $TAG" \
            --generate-notes \
            --notes "Built from \`$GITHUB_SHA\` at pubspec version \`$VERSION\`. The iOS archive is unsigned: Apple requires your own Developer certificate and provisioning profile before it can be installed on a device or distributed." \
            artifacts/android-release/FocusAR-Android.apk \
            artifacts/android-release/FocusAR-Android-arm64-v8a.apk \
            artifacts/ios-release/FocusAR-iOS-unsigned.ipa
